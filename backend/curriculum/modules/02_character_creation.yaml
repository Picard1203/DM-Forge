# curriculum/modules/02_character_creation.yaml

slug: character-creation
title: "Character Creation & Origins"
description: "Building characters step by step. Ability scores, species, backgrounds, classes intro, feats, equipment. As DM you need this to help players create characters and build NPCs."
order: 2
icon: user-plus
is_extension: false
estimated_hours: 8
xp_reward: 450

tasks:
  - slug: cc-colville-characters
    title: "Watch: Matt Colville — Making Characters (Running the Game #4)"
    description: "Character creation from a DM's perspective — what matters, what doesn't, how to help new players."
    order: 1
    task_type: video
    estimated_minutes: 20
    xp_reward: 25
    content:
      youtube_url: "https://www.youtube.com/watch?v=fUCpolL_6Tk"
      channel_name: "Matthew Colville"
      duration_minutes: 20

  - slug: cc-phb-create-character
    title: "Read: PHB — Ch.2 Creating a Character: Create Your Character (p.32-40)"
    description: "The step-by-step process. The 2024 version is reorganized: ability score bonuses come from backgrounds, not species."
    order: 2
    task_type: reading
    estimated_minutes: 25
    xp_reward: 30
    content:
      book_title: "Player's Handbook (2024)"
      page_start: 32
      page_end: 40
      summary_hint: "2024 order: 1) Choose a class, 2) Determine origin (species + background), 3) Determine ability scores, 4) Choose equipment, 5) Fill in details."

  - slug: cc-phb-level-advancement
    title: "Read: PHB — Level Advancement + Starting at Higher Levels + Multiclassing (p.41-45)"
    description: "How leveling works, XP thresholds, what you gain at each level. Multiclassing rules (know they exist, consider banning for first games)."
    order: 3
    task_type: reading
    estimated_minutes: 15
    xp_reward: 20
    content:
      book_title: "Player's Handbook (2024)"
      page_start: 41
      page_end: 45
      summary_hint: "For your first games: start at level 1, don't allow multiclassing. Keep it simple."

  - slug: cc-phb-origins
    title: "Read: PHB — Ch.4 Character Origins: Origin Components + Background Descriptions (p.176-185)"
    description: "How origins work in 2024: backgrounds now give ability score increases and origin feats. Read all 16 background options."
    order: 4
    task_type: reading
    estimated_minutes: 20
    xp_reward: 25
    content:
      book_title: "Player's Handbook (2024)"
      page_start: 176
      page_end: 185
      summary_hint: "Backgrounds give: +2/+1 to abilities (or +1/+1/+1), an Origin Feat, 2 skill proficiencies, 1 tool proficiency, and starting equipment."

  - slug: cc-phb-species
    title: "Read: PHB — Species Descriptions (p.186-197)"
    description: "All species: Aasimar, Dragonborn, Dwarf, Elf, Gnome, Goliath, Halfling, Human, Orc, Tiefling. Species give traits like darkvision, resistances, special abilities — but NOT ability score bonuses (that's backgrounds now)."
    order: 5
    task_type: reading
    estimated_minutes: 20
    xp_reward: 25
    content:
      book_title: "Player's Handbook (2024)"
      page_start: 186
      page_end: 197
      summary_hint: "For beginners: Human (versatile), Elf (darkvision, trance), Dwarf (hardy, darkvision), Halfling (lucky). Know what's available so you can help players choose."

  - slug: cc-phb-feats
    title: "Read: PHB — Ch.5 Feats: Overview + Origin Feats + Skim General Feats (p.198-210)"
    description: "Four feat categories: Origin Feats (from background, level 1), General Feats (level 4+), Fighting Style Feats, Epic Boon Feats (level 19). Know the popular ones."
    order: 6
    task_type: reading
    estimated_minutes: 20
    xp_reward: 25
    content:
      book_title: "Player's Handbook (2024)"
      page_start: 198
      page_end: 210
      summary_hint: "Popular feats to know: Alert, Sentinel, War Caster, Lucky, Great Weapon Master, Sharpshooter. Don't memorize all — know what's available."

  - slug: cc-phb-equipment
    title: "Read: PHB — Ch.6 Equipment: Weapons + Mastery Properties + Armor (p.212-222)"
    description: "Weapons table, damage dice, properties (finesse, heavy, light, two-handed, reach). Weapon Mastery (2024 new feature). Armor types and AC calculation."
    order: 7
    task_type: reading
    estimated_minutes: 20
    xp_reward: 25
    content:
      book_title: "Player's Handbook (2024)"
      page_start: 212
      page_end: 222
      summary_hint: "Weapon Mastery properties are new in 2024: Cleave, Graze, Nick, Push, Sap, Slow, Topple, Vex. Martial characters unlock these. Big tactical change from 2014."

  - slug: cc-character-sheet-video
    title: "Watch: How to Fill Out a 2024 D&D Character Sheet"
    description: "Video walkthrough of the 2024 sheet — every box explained."
    order: 8
    task_type: video
    estimated_minutes: 20
    xp_reward: 25
    content:
      youtube_url: "https://www.youtube.com/results?search_query=how+to+fill+out+2024+dnd+character+sheet+5e"
      channel_name: "Various"
      duration_minutes: 20

  - slug: cc-exercise-build-fighter
    title: "Exercise: Build a Level 1 Human Fighter (Soldier Background)"
    description: "Full character sheet on paper. Standard Array. Answer: What is AC? Attack bonus with longsword? HP? Saving throw proficiencies?"
    order: 9
    task_type: exercise
    estimated_minutes: 30
    xp_reward: 50
    content:
      instructions: "Use Standard Array (15,14,13,12,10,8). Soldier background. Pick a Fighting Style. Fill in the entire sheet."

  - slug: cc-exercise-build-wizard
    title: "Exercise: Build a Level 1 Elf Wizard (Sage Background)"
    description: "Spellcasters are more complex. Answer: Spell save DC? Spell attack bonus? How many spell slots? How many spells prepared?"
    order: 10
    task_type: exercise
    estimated_minutes: 30
    xp_reward: 50
    content:
      instructions: "Use Standard Array. Sage background. Choose cantrips and prepared spells. Fill in the entire sheet."

  - slug: cc-colville-alignment
    title: "Watch: Matt Colville — Alignment (Running the Game #14)"
    description: "The 9 alignments with pop culture examples. Superman = Lawful Good, Han Solo = Chaotic Neutral, Darth Vader = Lawful Evil."
    order: 11
    task_type: video
    estimated_minutes: 15
    xp_reward: 20
    content:
      youtube_url: "https://www.youtube.com/results?search_query=matt+colville+running+the+game+alignment"
      channel_name: "Matthew Colville"
      duration_minutes: 15

  - slug: cc-quiz-character-creation
    title: "Quiz: Character Creation"
    order: 12
    task_type: quiz_ref
    estimated_minutes: 8
    xp_reward: 50
    content:
      quiz_slug: cc-quiz-character-creation