# curriculum/modules/06_the_dms_role.yaml

slug: the-dms-role
title: "The DM's Role"
description: "What a DM does. Session zero. Table rules. Safety tools. Player types. Sandbox vs. railroad. Improv basics. DMG Chapters 1 and 2."
order: 6
icon: crown
is_extension: false
estimated_hours: 7
xp_reward: 400

tasks:
  - slug: dr-dmg-ch1-basics
    title: "Read: DMG — Ch.1 The Basics: What Does a DM Do? + Things You Need + Preparing/Running a Session + Example of Play (p.4-12)"
    description: "The DMG opens with what being a DM means. Includes a full example of play showing the conversation rhythm."
    order: 1
    task_type: reading
    estimated_minutes: 25
    xp_reward: 30
    content:
      book_title: "Dungeon Master's Guide (2024)"
      page_start: 4
      page_end: 12
      summary_hint: "Page 10 — Example of Play — is the most practical thing in the book for a new DM. It shows what running a game LOOKS like in conversation."

  - slug: dr-dmg-every-dm-unique
    title: "Read: DMG — Every DM is Unique + Ensuring Fun for All + Respect (p.13-19)"
    description: "Different DM styles, mutual respect, player-DM social contract, ensuring everyone has fun, respect for players and for the DM."
    order: 2
    task_type: reading
    estimated_minutes: 15
    xp_reward: 20
    content:
      book_title: "Dungeon Master's Guide (2024)"
      page_start: 13
      page_end: 19
      summary_hint: "Page 15 — Ensuring Fun for All — covers safety tools and table expectations. Essential reading before running for your unit."

  - slug: dr-dmg-know-players
    title: "Read: DMG — Ch.2 Running the Game: Know Your Players + Group Size + Narration (p.20-26)"
    description: "Understanding player types, managing group size (directly relevant to your 9-player situation), and narration techniques."
    order: 3
    task_type: reading
    estimated_minutes: 15
    xp_reward: 25
    content:
      book_title: "Dungeon Master's Guide (2024)"
      page_start: 20
      page_end: 26
      summary_hint: "Page 23 — Group Size — directly addresses large groups. Page 25 — Multiple DMs — is worth knowing about for future reference."

