# curriculum/modules/11_session_prep_lazy_dm.yaml
slug: session-prep-lazy-dm
title: "Session Prep & The Lazy DM"
description: "The Lazy DM 8-step methodology applied to real session preparation. Minimal-prep approaches for your ADHD brain and soldier schedule. Note-taking during and after sessions. Improvisation when players go off-script."
order: 11
icon: clipboard-list
is_extension: false
estimated_hours: 6
xp_reward: 400

tasks:

  - slug: sp-dmg-preparing-session
    title: "Read: DMG — Preparing a Session + How to Run a Session (p.8-9)"
    description: "The DMG's own concise advice on session prep and execution. Two pages that outline exactly what the designers think a DM should do before and during play."
    order: 1
    task_type: reading
    estimated_minutes: 10
    xp_reward: 15
    content:
      book_title: "Dungeon Master's Guide (2024)"
      page_start: 8
      page_end: 9
      summary_hint: "The DMG's prep advice is intentionally minimal: know the adventure, know the key NPCs, have the maps ready. Everything else is improvisation. The Lazy DM methodology expands on this with a concrete 8-step checklist."

  - slug: sp-lazy-dm-audiobook
    title: "Listen: Return of the Lazy Dungeon Master (Audible) — Chapters 1-3"
    description: "The core philosophy and the 8-step checklist. Listen on your treadmill. This is THE book for DMs with limited prep time."
    order: 2
    task_type: podcast
    estimated_minutes: 45
    xp_reward: 40
    content:
