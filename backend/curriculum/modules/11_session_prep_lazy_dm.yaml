  - slug: sp-note-taking
    title: "Watch: Bob World Builder — DM Note Taking Methods"
    description: "How to take notes during and after sessions. What to write down, what to skip, how to organize notes for the next session."
    order: 6
    task_type: video
    estimated_minutes: 15
    xp_reward: 20
    content:
      youtube_url: "https://www.youtube.com/results?search_query=bob+world+builder+dm+note+taking+methods"
      channel_name: "Bob World Builder"
      duration_minutes: 15

  - slug: sp-exercise-prep-session
    title: "Exercise: Prep a Session Using the 8 Steps"
    description: "Pick your starting village from the world building exercise. Prep a session using ALL 8 Lazy DM steps. Write it on a single page. This is your proof of concept."
    order: 7
    task_type: exercise
    estimated_minutes: 30
    xp_reward: 60
    content:
      instructions: "Use the village you built (Millhaven or your version). Fill in: 1) Review characters (use your pre-built Fighter and Wizard), 2) Strong start (what's happening when the session opens?), 3) Potential scenes (3-5 things that might happen), 4) Secrets and clues (5-10 pieces of information), 5) Fantastic locations (2-3 evocative places), 6) Important NPCs (3-5 from your NPC exercise), 7) Relevant monsters (from your encounter building exercise), 8) Treasure/magic items (one interesting reward). One page. That's it."

